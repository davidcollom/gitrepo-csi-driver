name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --config .golangci-lint.yml

      - name: Unit tests
        run: go test ./...

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint helm/gitrepo-csi-driver

      - name: Helm render check
        run: helm template gitrepo-csi-driver helm/gitrepo-csi-driver > /tmp/rendered.yaml
