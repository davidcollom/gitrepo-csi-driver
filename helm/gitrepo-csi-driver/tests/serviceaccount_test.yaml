suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders one ServiceAccount with default values
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount

  - it: produces no document when serviceAccount.create is false
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses release name to derive the ServiceAccount name by default
    release:
      name: my-release
    asserts:
      - equal:
          path: metadata.name
          value: my-release-gitrepo-csi-driver

  - it: uses serviceAccount.name when explicitly set
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: carries standard labels
    release:
      name: my-release
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: gitrepo-csi-driver
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: my-release
