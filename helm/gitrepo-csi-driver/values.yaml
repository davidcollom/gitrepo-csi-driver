nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

policy:
  existingConfigMap: ""
  fileName: policies.yaml
  content: |
    policies:
      - name: default
        namespaces:
          - default
        allowedRepositories:
          - https://github.com/example/*
        allowedHosts:
          - github.com
        revisions:
          requirePinnedCommit: false
          allowBranches: true
          allowTags: true
          allowedBranchPatterns: []
          allowedTagPatterns: []
        clone:
          defaultDepth: 1
          maxDepth: 10
          timeout: 30s
          maxRepositorySize: 104857600
          maxFileCount: 5000
          allowSparseCheckout: true
        submodules:
          enabled: false
          recursive: false
          maxDepth: 1
          allowedRepositories: []
          allowedHosts: []
        lfs:
          enabled: false
          maxObjectSize: 26214400
          maxTotalSize: 104857600
        credentials:
          defaultProfile: github-readonly
          allowedProfiles:
            - github-readonly

nodePlugin:
  enabled: true
  image:
    repository: ghcr.io/davidcollom/gitrepo-csi-nodeplugin
    tag: latest
    pullPolicy: IfNotPresent
  env:
    cacheDir: /var/lib/gitcontent/cache
    policyFile: /etc/gitcontent/policies.yaml
    listenAddr: :8080
    csiEndpoint: unix:///csi/csi.sock
  git:
    dropPrivileges: false
    runAsUser: 10001
    runAsGroup: 10001
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.13.0
      pullPolicy: IfNotPresent
    resources: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  permissions:
    enabled: true
    runAsUser: 0
    runAsGroup: 0
    resources: {}
  driver:
    name: gitcontent.csi.example.io
    attachRequired: false
    podInfoOnMount: true
    volumeLifecycleModes:
      - Ephemeral
  kubeletRootDir: /var/lib/kubelet
  pluginDir: /var/lib/kubelet/plugins/gitcontent.csi.example.io
  registrationDir: /var/lib/kubelet/plugins_registry
  resources: {}
  podLabels: {}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}

admissionWebhook:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/davidcollom/gitrepo-csi-admission-webhook
    tag: latest
    pullPolicy: IfNotPresent
  env:
    policyFile: /etc/gitcontent/policies.yaml
    listenAddr: :8443
  service:
    type: ClusterIP
    port: 8443
  resources: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
